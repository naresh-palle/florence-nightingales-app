name: Build and Deploy APK to GH Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: npm install

      - name: Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --parallel --daemon --max-workers=2

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Florence-Nightingales-App-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare GH Pages
        run: |
          mkdir -p public
          cp android/app/build/outputs/apk/release/app-release.apk public/app-release.apk
          echo '<!DOCTYPE html><html><head><title>Florence Nightingales App</title><meta name="viewport" content="width=device-width, initial-scale=1"></head><body style="font-family: sans-serif; text-align: center; padding: 50px; background-color: #f7fafc;"><img src="https://github.com/naresh-palle.png" style="width:100px; border-radius: 50%; margin-bottom: 20px;"><h1>Florence Nightingales App</h1><p style="color: #4a5568; margin-bottom: 30px;">Click below to download the latest Android APK directly to your phone.</p><a href="app-release.apk" style="display: inline-block; padding: 15px 30px; background: #c53030; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">Download Latest APK</a><p style="margin-top: 50px; font-size: 12px; color: #a0aec0;">Generated via GitHub Actions CI/CD</p></body></html>' > public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
